<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form class="register-form" action="/register" method="POST">
    <h1 class="register-title">Регистрация</h1>
    <div class="circle"></div>
    <div class="circle2"></div>
    <div class="form-group">
      <label class="form-label" for="name">Имя</label>
      <input class="form-input" type="text" id="name" name="name" placeholder="Введите имя" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" placeholder="Введите email" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Пароль</label>
      <input class="form-input" type="password" id="password" name="password" placeholder="Введите пароль" required>
    </div>
    
    <button class="register-btn" type="submit">Зарегистрироваться</button>
  </form>

</body><script src="main.js"></script>
</html>
